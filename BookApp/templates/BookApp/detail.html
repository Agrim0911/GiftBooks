{% extends 'BookApp/signin_base.html' %}
{% block body %}
<div class="container">
    <div class="row">
        <div class="col-md-7">
            <img src="{{book.cover_pic.url}}" height="700px" width="400px" style="float: left; margin-right: 3%;">
        </div>
        <div class="col-md-5">
            <h3>{{book.name}} 
                by {{book.publisher}}</h3>
            Class {{book.book_class}} <br>
            {{book.edition_year}} <br>
            {{book.price}} <br>
            {{book.condition}}<br>
            {{book.status}}<br>
            {{book.insert_date}}<br>

        </div>
    </div>
</div>
{% endblock %}
