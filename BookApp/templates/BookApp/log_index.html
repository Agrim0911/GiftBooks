{% extends 'BookApp/signin_base.html' %}
{% block body %}
<div class="container-fluid">
    <div class="row">
        <div class="col-md-12">
            <div class="banner">
                <div class="banner-text">
                    <h1>Give a book now by </h1>
                    <a href="{% url 'BookApp:add_book' %}"> clicking here</a>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="container">
    <div class="row">
        {% for book in book2 %}
        <div class="col-md-3">
            <a href="{% url 'books:detail' book.id %}" style="text-decoration-line: none;"><div class="card" style="height: 500px; margin-bottom: 30px; border: 2px 2px black;"> 
                <img class="card-img-top" src="{{book.cover_pic.url}}" height="300px">
                <div class="card-body">
                    <h5 class="card-title">{{book.name}}</h5>
                    <b class="card-text">Class {{book.book_class}}</b><br>
                    <b class="card-text">₹{{book.price}}</b>
                </div>
            </div></a>
        </div>
        {% endfor %}
    </div> 
</div>
{% endblock %}
