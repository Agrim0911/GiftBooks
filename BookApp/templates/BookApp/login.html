{% extends 'BookApp/signup_base.html' %}
{% block body %}

<div class="container-lg pt-3">
    <div class="row">
        <div class="col-md-6">
            <div class="card register" style="box-shadow:2px 2px 4px #000000;">
                <div class="card-body">
                    <form method="post">
                        {% csrf_token%}
                        <input type="text" name="email" id="email" placeholder="email"><br><br>
                        <input type="password" name="password" id="password" placeholder="password"><br><br>
                        <input type="submit" value="Login"><br><br>
                        <a href="{% url 'BookApp:register' %}">Sign up now!</a>
                        {% if messages %}
                            {% for message in messages %}
                                <li style="color: red; list-style: none;">{{ message }}</li>
                            {% endfor %}
                        {% endif %}
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
